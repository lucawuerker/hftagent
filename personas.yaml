# Product personas for the strategy compiler (decision 2026-08-03).
#
# A persona changes ONLY (a) the theme filter — which of the book's factors
# feed the model ("ich möchte vor allem fundamentale / mean-reversion / …
# Faktoren") — and (b) the risk layer.  The alpha pipeline itself is identical
# for every persona (see backtesting/strategy_compiler.py).
#
# max_positions: customer books are concentrated (retail cannot manually trade
# 100 names daily); ~10–20 depending on account size / tradable volume — the
# product can map account size → max_positions at onboarding.  The "master"
# persona is the research/automated-execution reference: full breadth,
# market-neutral.  Entry/exit hysteresis (exit_buffer) keeps concentrated
# books from churning names at the rank edge.

personas:
  - key: master
    description: Full-breadth market-neutral reference book (research / automated execution).
    categories: null
    max_factors: 64
    risk:
      vol_target: 0.10
      net_exposure: 0.0
      halflife: 6
      band: 0.10
      max_positions: null

  - key: aggressive_short_term
    description: Aggressive short-term trading, fast signals, higher risk.
    categories: [microstructure, statistical_arbitrage, momentum]
    max_factors: 20
    risk:
      vol_target: 0.15
      net_exposure: 0.0
      halflife: 3
      band: 0.05
      max_positions: 15
      max_leverage: 3.0

  - key: defensive_low_turnover
    description: Defensive, low churn, quality/value tilt, modest net-long.
    categories: [mean_reversion, carry, other, volatility]
    prefer_fundamental: true
    max_factors: 14
    risk:
      vol_target: 0.06
      net_exposure: 0.20
      halflife: 12
      band: 0.25
      max_positions: 12
      max_leverage: 1.5

  - key: earnings_events
    description: Trades earnings surprises and analyst behaviour.
    keywords: [earnings, eps, analyst, surprise, estimate, corporate, valuation]
    max_factors: 16
    risk:
      vol_target: 0.10
      net_exposure: 0.0
      halflife: 6
      band: 0.10
      max_positions: 15

  - key: diversified_all_weather
    description: Maximally diversified, nothing dominating, robust across regimes.
    categories: null
    diversify: true
    max_factors: 24
    risk:
      vol_target: 0.08
      net_exposure: 0.10
      halflife: 10
      band: 0.15
      max_positions: 20

  - key: contrarian_dip_buyer
    description: Buys panic, sells euphoria — fades overreactions.
    categories: [mean_reversion, microstructure]
    keywords: [reversal, snapback, reversion, overreaction, dislocation, fade, exhaustion]
    max_factors: 18
    risk:
      vol_target: 0.12
      net_exposure: 0.0
      halflife: 4
      band: 0.08
      max_positions: 15
