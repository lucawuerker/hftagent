# NON-market-neutral persona family (user decision 2026-08-03: "ich muss nicht
# unbedingt marktneutrale Strategien anbieten").
#
# Construction (revised same day): NO index sleeve — the net exposure comes
# from the STOCK PICKS themselves.  The long leg overweights the model's
# best-ranked names (gross (1+ν)/2), the short leg shrinks to the worst names
# (gross (1−ν)/2); ν=1 is a pure long-only picking book.  Market beta emerges
# from the picks, not from blending the index.  beta_neutral only cleans the
# RANKING before the legs are formed.  The report still shows the equal-weight
# buy-and-hold benchmark for honest comparison.  Vol targets scale with net
# exposure (a net-1.0 book at a 10% target would just de-lever itself away).

personas:
  - key: master_long30
    description: Full breadth, 30% net long, moderate vol — balanced flagship.
    categories: null
    max_factors: 64
    risk: {vol_target: 0.10, net_exposure: 0.30, halflife: 6, band: 0.10,
           max_positions: null, max_leverage: 2.5}

  - key: master_long60
    description: Full breadth, 60% net long — growth profile.
    categories: null
    max_factors: 64
