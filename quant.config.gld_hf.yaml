# GLD high-frequency (10s LOBSTER bars) single-ticker research config.
# Written 2026-08-03 for the local L4WF-style walk-forward run on gold
# (forecast horizon 60 bars = 10 min; fundamentals OFF — the LOBSTER feed
# carries only microstructure fields, so the researcher's data context and
# the retrieval scope mask restrict to price/general papers automatically).
data:
  provider: lobster
  asset_class: equity
  frequency: 10s
  data_dir: ticker_data
  lobster_level: 3
  cache_dir: data/market
  tickers: [GLD]
  fundamentals: false
  dtype: float32
